name: Tox

on:
  push:
    branches: [ master, main, 'maint/*' ]
    tags: [ '*' ]
  pull_request:
    branches: [ master, main, 'maint/*' ]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force tox and pytest to use color
  FORCE_COLOR: true
  TEST_DATA_HOME: /home/runner/testdata/nitransforms-tests
  TEST_DATA_REPO: https://github.com/nipreps-data/nitransforms-tests

jobs:
  cache-test-data:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    outputs:
      SHA: ${{ steps.test-head.outputs.SHA }}
    steps:
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Git settings (pacify DataLad)
        run: |
          git config --global user.name 'NiPreps Bot'
          git config --global user.email 'nipreps@gmail.com'
      - name: Install git-annex and DataLad
        run: |
          uv tool install \
            --with-executables-from=git-annex \
            --with-executables-from=datalad-next \
            --with-executables-from=datalad-osf \
            datalad
      - name: Check remote HEAD
        id: test-head
        run: |
          git ls-remote $TEST_DATA_REPO \
            | awk '/HEAD/{ print "SHA=" $1 }' >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEST_DATA_HOME }}
          key: data-cache-v3-${{ steps.test-head.outputs.SHA }}
          restore-keys: |
            data-cache-v3-${{ steps.test-head.outputs.SHA }}
            data-cache-v3

      - name: Install test data
        run: |
          export PATH=$CONDA/bin:$PATH
          mkdir -p /home/runner/testdata

          datalad install -s $TEST_DATA_REPO $TEST_DATA_HOME
          datalad update --merge -d $TEST_DATA_HOME
          datalad get -J 2 -d $TEST_DATA_HOME

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [cache-test-data]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dependencies: [latest, pre]
        include:
          - python-version: "3.11"
            dependencies: min
          # h5py has no cp315 wheels on PyPI yet; add "latest" when it does
          - python-version: "3.15"
            dependencies: pre
        exclude:
          # Do not test pre-releases for versions out of SPEC0
          - python-version: "3.11"
            dependencies: pre
          - python-version: "3.12"
            dependencies: pre

    env:
      DEPENDS: ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TEST_DATA_HOME }}
          key: data-cache-v3-${{ needs.cache-test-data.outputs.SHA }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        run: tox -v --exit-and-dump-after 1200
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ always() }}


  slow-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [cache-test-data]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        dependencies: [latest, pre]
        include:
          - python-version: "3.10"
            dependencies: min
        exclude:
          # Do not test pre-releases for versions out of SPEC0
          - python-version: "3.10"
            dependencies: pre
          - python-version: "3.11"
            dependencies: pre

    env:
      DEPENDS: ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.TEST_DATA_HOME }}
          key: data-cache-v2-${{ needs.cache-test-data.outputs.SHA }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install tox
        run: |
          uv tool install tox --with=tox-uv --with=tox-gh-actions
      - name: Show tox config
        run: tox c
      - name: Run tox
        run: tox -v -e slow-tests --exit-and-dump-after 1200

  checks:
    runs-on: 'ubuntu-latest'
    continue-on-error: true
    strategy:
      matrix:
        check: ['style']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Show tox config
        run: uvx tox c
      - name: Show tox config (this call)
        run: uvx tox c -e ${{ matrix.check }}
      - name: Run check
        run: uvx tox -e ${{ matrix.check }}
